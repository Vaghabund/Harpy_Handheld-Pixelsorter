[target.aarch64-unknown-linux-gnu]
# Cross image with the GUI dependencies egui/winit need installed
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5"  # pinned for reproducible builds

# Pre-build command to install required packages
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y libxkbcommon-dev:arm64 libxcb-render0-dev:arm64 libxcb-shape0-dev:arm64 libxcb-xfixes0-dev:arm64"
]
